name: CI

# BE-2.23: every push to every branch, and every pull request (any base).
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # generateSitemaps runs at build time (like generateStaticParams) and
      # queries the database directly, so `pnpm build` needs a real reachable
      # Postgres, not just a placeholder URL — an empty migrated database is
      # enough, sitemap.ts only needs the query to succeed, not return rows.
      - name: Apply all migrations
        run: node scripts/migrate.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          BETTER_AUTH_SECRET: "ci-placeholder-secret"
          BETTER_AUTH_URL: "http://localhost:3000"

  # SEC-2.09: no secret (API key, password, token) is committed to the repo.
  # gitleaks scans the full history on every run so a secret buried in an old
  # commit on this branch still fails CI, not just the current diff.
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # SEC-2.10: fail CI on any high/critical advisory in a direct or transitive
  # dependency. `pnpm audit --audit-level=high` does NOT gate on severity —
  # pnpm's --audit-level only filters what's printed, and pnpm audit's exit
  # code is 1 for any finding at all (including low/moderate). scripts/audit-high.mjs
  # reads the audit's own severity counts and gates on high+critical only.
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (high/critical only)
        run: node scripts/audit-high.mjs

  # BC-1.08: the Solidity contract (contracts/) builds and its Foundry test
  # suite passes on every push/PR. No Postgres needed — purely on-chain logic.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: forge build
        run: forge build
        working-directory: contracts

      - name: forge test
        run: forge test -vvv
        working-directory: contracts

  # DB-2.13: every migration applies to an empty database, twice, without error
  # and without changing the schema on the second pass.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrations apply twice to an empty database
        run: node scripts/migrations-check.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  # BE-2.24 / BE-2.25: the whole vitest suite, unit and integration, against a
  # real Postgres with every migration applied; one merged coverage report,
  # with the per-module floors in vitest.config.ts enforced.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # A non-superuser owner, not the `postgres` superuser: DB-2.01/2.02 assert
      # the owner is refused TRUNCATE on append-only tables by privilege
      # (0035_db2_app_role), which is only true for a real (non-bypassing) role.
      # Matches what production actually connects as (neondb_owner on Neon: not
      # a superuser, owns the schema) far more closely than the postgres role.
      DATABASE_URL: postgresql://artwall_owner:artwall_owner@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql://artwall_owner:artwall_owner@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create non-superuser owner role
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -v ON_ERROR_STOP=1 -c "
            create role artwall_owner login password 'artwall_owner' createrole;
            alter database postgres owner to artwall_owner;
          "
        env:
          PGPASSWORD: postgres

      - name: Apply all migrations
        run: node scripts/migrate.mjs

      # Reference data the suite books against (sizes, slot types, refund policy).
      - name: Seed catalogs
        run: node scripts/seed-physical-wall.mjs

      - name: Unit tests
        run: pnpm vitest run --coverage --reporter=default --reporter=blob --outputFile.blob=.vitest-reports/unit.json

      # Real Cloudinary for the DPDP file-deletion tests; without these secrets
      # (forks) that one file skips and everything else runs on stand-ins.
      - name: Integration tests
        run: pnpm vitest run --config vitest.db.config.ts --coverage --reporter=default --reporter=blob --outputFile.blob=.vitest-reports/db.json
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

      - name: Merged coverage and floors
        run: pnpm vitest --merge-reports --coverage --reporter=dot

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e 'const t=require("./coverage/coverage-summary.json").total;console.log("## Coverage\n\n| | % |\n|---|---|\n"+["lines","statements","functions","branches"].map(k=>`| ${k} | ${t[k].pct} |`).join("\n"))' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
