[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]


# BC-2.02: the invariant handler signs a real ECDSA voucher (vm.sign) on
# every call, so the default depth (500) with 256 runs is far too slow
# (observed: did not finish in 3+ minutes). 64 runs x depth 25 still
# explores plenty of mint sequences while finishing in single-digit seconds.
[invariant]
runs = 64
depth = 25

[rpc_endpoints]
# Bible §15/§19 names Polygon zkEVM as the chain for the five-contract
# architecture (ArtworkRegistry, WallRegistry, ExhibitionManager,
# RevenueDistributor, MerkleVerifier). Confirmed by the founder 2026-11-12.
#
# Base Sepolia stays because ArtwallCOA already targets it (Base L2 is the
# Bible's NFT path, §10) — the two are different products on purpose, not a
# leftover. Deploy the five to zkEVM; leave the COA NFT where it is.
polygon_zkevm = "${POLYGON_ZKEVM_RPC_URL}"
polygon_zkevm_testnet = "${POLYGON_ZKEVM_TESTNET_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
